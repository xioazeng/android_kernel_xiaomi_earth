name: Build Xiaomi 12C Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          git curl ccache automake flex lzop bison gperf \
          build-essential zip zlib1g-dev gcc-multilib \
          g++-multilib libc6-dev-i386 lib32ncurses5-dev \
          x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip \
          python3 bc libssl-dev wget

      - name: Setup Clang
        run: |
          git clone --depth=1 \
          https://github.com/kdrag0n/proton-clang clang

      # ===== KernelSU Next 最新版 =====
      - name: Setup KernelSU Next
        run: |
          curl -LSs \
          "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" \
          | bash -s dev

      # ===== 最新 SUSFS (4.19 NON-GKI) =====
      - name: Setup Latest SUSFS
        run: |
          echo "Kernel Version:"
          make kernelversion

          git clone --depth=1 \
          https://github.com/sidex15/ksu_module_susfs.git susfs

          # 检测 4.19
          KERNEL_VER=$(make kernelversion)

          if [[ "$KERNEL_VER" == 4.19* ]]; then
            echo "Detected Linux 4.19"

            # 覆盖 SUSFS patch
            cp -rf susfs/kernel_patches/KernelSU-Next/4.19/* .
          else
            echo "Unsupported kernel version"
            exit 1
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=github
          export KBUILD_BUILD_HOST=actions

          export PATH=$PWD/clang/bin:$PATH

          mkdir -p out

          make O=out ARCH=arm64 earth_defconfig

          # 启用 KernelSU + SUSFS
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_SUSFS=y" >> out/.config

          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Check Build Output
        run: |
          ls -lah out/arch/arm64/boot/

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi12C-Kernel
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtb*
